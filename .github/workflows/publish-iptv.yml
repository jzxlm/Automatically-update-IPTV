name: Publish IPTV Playlists

on:
  workflow_dispatch:
  schedule:
    - cron: "30 2 * * *"

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build V7 playlists
        run: python scripts/organize_v7.py

      - name: Build subscription index
        run: python scripts/generate_playlist_index.py

      - name: Validate
        shell: bash
        run: |
          set -e
          test -f output/movies_tv_final.m3u
          test "$(head -n 1 output/movies_tv_final.m3u)" = "#EXTM3U"
          count=$(grep -c '^#EXTINF:' output/movies_tv_final.m3u || true)
          echo "EXTINF entries: $count"
          test "$count" -gt 0
          urls=$(grep -v '^#' output/movies_tv_final.m3u | sed '/^$/d' | sort | uniq -d | head)
          if [ -n "$urls" ]; then echo "Duplicate URLs:"; echo "$urls"; exit 1; fi

      - name: Commit changed playlists
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add PLAYLISTS.md output data/movie_tv_v7_result.json data/movie_tv_v7_summary.json
          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "auto: update IPTV V7 playlists"
            git push
          fi
